<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una Photo Journal</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  overflow-x: hidden;
}

body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: #f7f7f7;
}

/* ===== NAV & LOGO ===== */
nav {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 18px;
  z-index: 1000;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

nav a {
  margin-left: 25px;
  text-decoration: none;
  color: black;
}

.logo {
  position: fixed;
  top: 30px;
  left: 40px;
  font-size: 30px;
  font-weight: 600;
  z-index: 1000;
  transition: opacity 0.5s ease, transform 0.5s ease;
}

nav.hide, .logo.hide {
  opacity: 0;
  transform: translateY(-20px);
  pointer-events: none;
}

/* ===== DESKTOP 拼貼 (電腦版保持不動) ===== */
.gallery {
  position: relative;
  width: 100%;
  margin: auto;
  padding-top: 120px;
}

.gallery img {
  position: absolute;
  width: 16%;
  max-width: 100%;
  height: auto;
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.05);
}

/* 電腦版位置 */
.img1 { top: 18%; left: 12%; }
.img2 { top: 25%; left: 30%; }
.img3 { top: 43%; left: 9%; }
.img4 { top: 65%; left: 28%; }
.img5 { top: 38%; left: 55%; }
.img6 { top: 55%; left: 73%; }
.img7 { top: 18%; left: 60%; }

/* ===== 📱 MOBILE (重點修正區) ===== */
/* ===== 📱 MOBILE 修正版 (無旋轉、緊湊拼貼) ===== */
@media (max-width: 768px) {
  /* Logo & Nav 調整 */
  .logo {
    top: 15px;
    left: 18px;
    font-size: 20px;
  }

  nav {
    top: 18px;
    right: 15px;
    display: flex;
    gap: 8px;
  }

  nav a {
    margin-left: 0;
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  /* 調整容器：縮小間距，消除空洞感 */
  .gallery {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr; /* 兩欄 */
    column-gap: 12px; /* 左右間距 */
    row-gap: 8px;    /* ⭐ 極小的行間距，防止看起來像少一張圖 */
    padding: 80px 12px 60px; /* 上方留白縮減到 80px */
  }

  .gallery img {
    position: relative;
    width: 100%;
    top: auto !important;   /* 清除電腦版絕對定位 */
    left: auto !important;  /* 清除電腦版絕對定位 */
    object-fit: contain;
    /* 取消旋轉，改用淡淡的陰影增加質感 */
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
  }

  /* ✨ 緊湊型拼貼位移 (不使用 Rotate) ✨ */
  /* 我們讓右邊那欄 (2, 4, 6) 稍微往下偏一點，左邊那欄保持緊湊 */
  
  .img1 {transform: translateY(10px); /* 左排微降 */}
  .img2 {transform: translateY(25px);}
  .img3 {transform: translateY(-90px); /* ⭐ 微調向上，緊貼第一張 */}
  .img4 {transform: translateY(35px); }
  .img5 {transform: translateY(-50px); /* ⭐ 微調向上，緊貼第三張 */}
  .img6 {transform: translateY(15px); }
  .img7 {transform: translateY(-20px); }
}

/* 確保大螢幕維持比例 */
@media (min-width: 901px) {
  .gallery {
    aspect-ratio: 16/9;
  }
}
</style>
</head>

<body>

<div class="logo">Una</div>

<nav>
  <a href="about.html">About</a>
  <a href="gallery.html">Gallery</a>
  <a href="travel.html">Travel</a>
  <a href="photos.html">Photos</a>
  <a href="views.html">Views</a>
  <a href="friends.html">Friends</a>
</nav>

<div class="gallery">
  <img src="images/index/index1.JPG" class="img1">
  <img src="images/index/index2.JPG" class="img2">
  <img src="images/index/index3.JPG" class="img3">
  <img src="images/index/index4.png" class="img4">
  <img src="images/index/index5.JPG" class="img5">
  <img src="images/index/index6.JPG" class="img6">
  <img src="images/index/index7.JPG" class="img7">
</div>

<script>
const nav = document.querySelector("nav");
const logo = document.querySelector(".logo");

window.addEventListener("scroll", () => {
  if (window.scrollY < 50) {
    nav.classList.remove("hide");
    logo.classList.remove("hide");
  } else {
    nav.classList.add("hide");
    logo.classList.add("hide");
  }
});
</script>

</body>
</html>
