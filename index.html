<!DOCTYPE html>
<html>

<head>
<title>Una Photo Journal</title>

<style>

body{
margin:0;
font-family:Helvetica, Arial, sans-serif;
background:#f7f7f7;
}

/* ===== NAV ===== */

nav{
position:fixed;
top:30px;
right:40px;
font-size:18px;
z-index:1000;
}

nav a{
margin-left:25px;
text-decoration:none;
color:black;
}

.logo{
position:fixed;
top:30px;
left:40px;
font-size:30px;
font-weight:600;
z-index:1000;
}

/* ===== DESKTOP 拼貼 ===== */

.gallery{
position:relative;
width:90vw;
aspect-ratio:16/9;
margin:auto;
padding-top:120px;
}

.gallery img{
position:absolute;
width:16%;
height:auto;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* 拼貼位置 */

.img1{top:18%; left:12%;}
.img2{top:25%; left:30%;}
.img3{top:43%; left:9%;}
.img4{top:65%; left:28%;}
.img5{top:38%; left:55%;}
.img6{top:55%; left:73%;}
.img7{top:18%; left:60%;}

/* ===== 📱 MOBILE（關鍵） ===== */

@media (max-width:900px){

.gallery{
position:static;
width:100%;
aspect-ratio:auto;

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

padding:120px 20px 40px 20px;
}

.gallery img{
position:static;
width:100%;
aspect-ratio:1/1;
object-fit:cover;
}

}

</style>

</head>

<body>

<div class="logo">Una</div>

<nav>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="travel.html">Travel</a>
<a href="photos.html">Photos</a>
<a href="views.html">Views</a>
<a href="friends.html">Friends</a>
</nav>

<div class="gallery">

<img src="images/index/index1.JPG" class="img1">
<img src="images/index/index2.JPG" class="img2">
<img src="images/index/index3.JPG" class="img3">
<img src="images/index/index4.png" class="img4">
<img src="images/index/index5.JPG" class="img5">
<img src="images/index/index6.JPG" class="img6">
<img src="images/index/index7.JPG" class="img7">

</div>

</body>
</html>
