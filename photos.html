<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Album</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: #f6f3ef;
}

/* ===== NAV (跟你首頁同風格) ===== */
nav {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 18px;
  z-index: 9999;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

nav a {
  margin-left: 25px;
  text-decoration: none;
  color: black;
}

.logo {
  position: fixed;
  top: 30px;
  left: 40px;
  font-size: 30px;
  font-weight: 600;
  text-decoration: none;
  color: black;
  z-index: 9999;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

nav.hide, .logo.hide {
  opacity: 0;
  transform: translateY(-20px);
}

/* ===== BOOK ===== */
.book {
  width: 90%;
  max-width: 800px;
  margin: 120px auto 40px;
  perspective: 2000px;
}

.page-container {
  position: relative;
  height: 520px;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transform-origin: left;
  transition: transform 0.8s ease;
  backface-visibility: hidden;
}

.page.flipped {
  transform: rotateY(-180deg);
}

/* ===== CONTENT ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.photo-card {
  background: #fff;
  padding: 10px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transform: rotate(-1deg);
}

.photo-card:nth-child(2) {
  transform: rotate(2deg);
}

.photo-card img {
  width: 100%;
  border-radius: 10px;
}

.caption {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.controls {
  text-align: center;
  margin-top: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: black;
  color: white;
  cursor: pointer;
}

/* ===== MOBILE ===== */

  .logo {
    top: 15px;
    left: 18px;
    font-size: 20px;
  }

  nav {
    top: 18px;
    right: 15px;
    display: flex;
    gap: 8px;
  }

  nav a {
