<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Album</title>

<style>
body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: #f6f3ef;
}

/* ===== NAV (跟你首頁同風格) ===== */
nav {
  position: fixed;
  top: 30px;
  right: 40px;
  font-size: 18px;
  z-index: 9999;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

nav a {
  margin-left: 25px;
  text-decoration: none;
  color: black;
}

.logo {
  position: fixed;
  top: 30px;
  left: 40px;
  font-size: 30px;
  font-weight: 600;
  text-decoration: none;
  color: black;
  z-index: 9999;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

nav.hide, .logo.hide {
  opacity: 0;
  transform: translateY(-20px);
}

/* ===== BOOK ===== */
.book {
  width: 90%;
  max-width: 800px;
  margin: 120px auto 40px;
  perspective: 2000px;
}

.page-container {
  position: relative;
  height: 520px;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transform-origin: left;
  transition: transform 0.8s ease;
  backface-visibility: hidden;
}

.page.flipped {
  transform: rotateY(-180deg);
}

/* ===== CONTENT ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.photo-card {
  background: #fff;
  padding: 10px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transform: rotate(-1deg);
}

.photo-card:nth-child(2) {
  transform: rotate(2deg);
}

.photo-card img {
  width: 100%;
  border-radius: 10px;
}

.caption {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
}

.controls {
  text-align: center;
  margin-top: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: black;
  color: white;
  cursor: pointer;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .logo {
    top: 15px;
    left: 18px;
    font-size: 20px;
  }

  nav {
    top: 18px;
    right: 15px;
    display: flex;
    gap: 8px;
  }

  nav a {
    margin-left: 0;
    font-size: 11px;
  }

  .book {
    margin-top: 90px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .page-container {
    height: auto;
  }

  .page {
    position: relative;
    transform: none !important;
  }
}
</style>
</head>

<body>

<a href="index.html" class="logo">Una</a>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="gallery.html">Gallery</a>
<a href="travel.html">Travel</a>
<a href="views.html">Views</a>
<a href="friends.html">Friends</a>
</nav>

<div class="book">
  <div class="page-container">

    <div class="page">
      <div class="grid">
        <div class="photo-card">
          <img src="https://via.placeholder.com/300">
          <p class="caption">今天看到的可愛杯子 ☕</p>
        </div>
        <div class="photo-card">
          <img src="https://via.placeholder.com/300">
          <p class="caption">路邊的小花 🌼</p>
        </div>
      </div>
    </div>

    <div class="page">
      <div class="grid">
        <div class="photo-card">
          <img src="https://via.placeholder.com/300">
          <p class="caption">咖啡店角落</p>
        </div>
        <div class="photo-card">
          <img src="https://via.placeholder.com/300">
          <p class="caption">可愛小狗 🐶</p>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="controls">
  <button onclick="prevPage()">◀</button>
  <button onclick="nextPage()">▶</button>
</div>

<script>
let current = 0;
const pages = document.querySelectorAll('.page');

function nextPage() {
  if (current < pages.length) {
    pages[current].classList.add('flipped');
    current++;
  }
}

function prevPage() {
  if (current > 0) {
    current--;
    pages[current].classList.remove('flipped');
  }
}

// NAV SCROLL
const nav = document.querySelector("nav");
const logo = document.querySelector(".logo");
let lastScroll = 0;

window.addEventListener("scroll", () => {
  let currentScroll = window.scrollY;

  if (currentScroll > lastScroll && currentScroll > 50) {
    nav.classList.add("hide");
    logo.classList.add("hide");
  } else {
    nav.classList.remove("hide");
    logo.classList.remove("hide");
  }

  lastScroll = currentScroll;
});
</script>

</body>
</html>
